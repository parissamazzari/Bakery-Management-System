name: bakery-management-system

networks:
  bakery-net:
    driver: bridge

volumes:
  db_data:
  rabbitmq_data:

services:
  db:
    image: postgres:16-alpine
    container_name: bakery_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bakery}
      POSTGRES_USER: ${POSTGRES_USER:-bakery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bakery_pass}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bakery_user} -d ${POSTGRES_DB:-bakery}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [bakery-net]

  redis:
    image: redis:7-alpine
    container_name: bakery_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [bakery-net]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bakery_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bakery}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-bakery_pass}
    ports:
      - "15672:15672" # management UI - http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [bakery-net]

  backend:
    build: ./backend
    container_name: bakery_backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    ports:
      - "8000:8000" # API - http://localhost:8000/docs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [bakery-net]

  worker:
    build: ./worker
    container_name: bakery_worker
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [bakery-net]

  frontend:
    build: ./frontend
    container_name: bakery_frontend
    restart: unless-stopped
    ports:
      - "8080:80" # web UI - http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    networks: [bakery-net]
